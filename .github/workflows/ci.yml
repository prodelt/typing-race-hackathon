name: CI

# THROWAWAY experiment on a scratch branch: repeat the one WebKit test, before and after the fix.
on:
  pull_request:

env:
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '12.8.1'

jobs:
  stress:
    name: stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit

      - name: before the fix, 60 repeats on webkit
        continue-on-error: true
        run: pnpm exec playwright test e2e/zz-old.spec.ts -g "shows the keyboard, the next-key highlight" --project=webkit --repeat-each=60 --retries=0 --reporter=dot 2>&1 | grep -v WebServer | tail -15

      - name: after the fix, 60 repeats on webkit
        continue-on-error: true
        run: pnpm exec playwright test e2e/exercise.spec.ts -g "shows the keyboard, the next-key highlight" --project=webkit --repeat-each=60 --retries=0 --reporter=dot 2>&1 | grep -v WebServer | tail -15
