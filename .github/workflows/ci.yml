name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '12.8.1'

jobs:
  # typecheck · lint · unit · build · dictionary-checksum
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        # Includes the seam-boundary scan in tools/architecture.test.ts.
        run: pnpm test
      - name: build
        # The initial-JS budget plugin fails this step past 150 KB gzip (ticket 15).
        run: pnpm build

      - name: dictionary-checksum
        # F1 ships no derived dictionary data. The job exists so F3 inherits the gate rather than
        # inventing it, and so its absence is a visible "nothing to verify" instead of a silence.
        run: |
          if [ -d data/derived ]; then
            sha256sum -c data/derived/CHECKSUMS.txt
          else
            echo 'no data/derived yet — nothing to verify in F1'
          fi

  # E2E against the production build, all three engines (Definition of Done, ADR-0009).
  e2e:
    name: e2e ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # e2e-cdp · latency · axe — Chromium only, each for its own reason.
  chromium-only:
    name: cdp, latency and axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: e2e-cdp
        # Simulating a physical ЙЦУКЕН layout needs the DevTools Protocol: Playwright's keyboard
        # API cannot type Cyrillic in any engine (research 06).
        run: pnpm exec playwright test --project=cdp
      - name: latency
        # Keystroke-to-paint p95 <= 16 ms, frame-rate limiting off (research R8).
        run: pnpm exec playwright test --project=latency
      - name: axe
        # Zero violations. The audit runs inside the tagged accessibility specs.
        run: pnpm exec playwright test --project=chromium --grep @axe

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
